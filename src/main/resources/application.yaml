spring:
  application:
    name: employee-service
  profiles:
    active: dev
logging:
  level:
    root: INFO
    com.employee: DEBUG
  file:
    name: logs/employee-service.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

